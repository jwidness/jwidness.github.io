<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local outlier map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  /* ---- page and map surface ---- */
  html, body { margin:0; height:100%; font-family: system-ui, sans-serif; }
  #map { position:absolute; inset:0; background:#2b2b2b; }
  .basemap-muted { filter: grayscale(100%) brightness(1.12) contrast(0.75); }
  .cell-tile { image-rendering: pixelated; }

  /* ---- control panel shell ---- */
  .panel {
    position:absolute; top:10px; left:10px; z-index:1000; width:300px;
    background:rgba(255,255,255,0.94); border-radius:6px; padding:10px 0;
    box-shadow:0 2px 8px rgba(0,0,0,0.3); font-size:12px; line-height:1.45;
    max-height:calc(100vh - 40px);
    display:flex; flex-direction:column;
  }
  .panel-inner { overflow-y:auto; overflow-x:hidden; min-height:0; padding:0 12px; }
  .panel h1 { font-size:13px; margin:0 0 8px; }
  .panel h1 .help-link { float:right; font-size:11px; font-weight:400; color:#999; text-decoration:none; }
  .panel h1 .help-link:hover { color:#222; text-decoration:underline; }
  .panel label { display:block; margin:6px 0 2px; font-weight:600; color:#333; }
  .panel input, .panel select { width:100%; box-sizing:border-box; font-size:12px; padding:3px 4px; }
  .panel .row { display:flex; gap:6px; align-items:flex-end; }
  .panel .row.top { align-items:flex-start; }
  .panel .row > div { flex:1; }
  .panel button { margin-top:10px; width:100%; box-sizing:border-box; padding:5px;
                  font-size:12px; cursor:pointer; }
  .panel.collapsed { width:80px; padding:0; overflow:hidden; }
  .panel.collapsed .panel-inner { display:none; }
  .panel .panel-tab { width:auto; margin:8px 12px 0; padding:4px 8px; background:#e8e8e8; color:#555;
                      border:1px solid #bbb; border-radius:4px; font-size:12px; font-weight:600;
                      line-height:1; text-align:center; }
  .panel .panel-tab:hover { background:#ddd; color:#333; }
  .panel.collapsed .panel-tab { margin:0; border-radius:6px; padding:8px; }
  .band { margin:0 -12px 9px; padding:1px 12px 2px 6px; border-left:6px solid #bbb; }
  .band-compare { border-left-color:#4f7cb5; }
  .band-paint   { border-left-color:#9a6ea8; }
  .panel .sect { font-weight:600; color:#555; font-size:11px; margin:6px 0 2px; }
  .panel label .tip { color:#999; cursor:help; font-weight:400; margin-left:3px; }
  .panel label .tip:hover { color:#222; }
  .panel label .fit, .panel label .toggle { float:right; width:auto; margin:0; padding:1px 5px;
                      font-size:11px; font-weight:400; line-height:1.4; cursor:pointer; color:#555;
                      background:#e8e8e8; border:1px solid #bbb; border-radius:4px; }
  .panel label .fit:hover, .panel label .toggle:hover { background:#ddd; color:#222; }
  .panel label .fit.warn { color:#4a3000; background:#f7c948; border-color:#c99400;
                           font-weight:600; }
  .panel label .fit.warn:hover { background:#efbb2e; color:#3a2500; }
  .panel label .toggle { margin-left:8px; }
  .panel label .toggle.on { background:#e8f0fb; border-color:#7ea6dc; color:#1a4f8f; }
  .panel .check { display:flex; align-items:center; gap:5px; margin:8px 0 2px; }
  .panel .check input { width:auto; margin:0; }
  .panel .check.off { color:#aaa; }
  .panel .check[hidden] { display:none; }
  .panel .check .lock-note { color:#888; font-weight:400; margin-left:4px; }
  .check-row { display:flex; gap:6px; font-size:11px; margin-top:5px; }
  .panel .check-row .check { margin:0; font-weight:400; }
  .ramp { position:relative; height:12px; border-radius:2px; margin:4px 3px 1px; background:#ccc; }
  .ramp .grip { position:absolute; top:-4px; width:5px; height:20px; margin-left:-2px; cursor:ew-resize;
                background:#555; border:1px solid #fff; border-radius:2px;
                box-shadow:0 0 0 1px rgba(0,0,0,0.3); }
  .ramp-ticks { position:relative; height:11px; font-size:9px; color:#555; }
  .ramp-ticks span { position:absolute; transform:translateX(-50%); white-space:nowrap; }
  .ramp-labels { display:flex; justify-content:space-between; color:#555; font-size:10px; }
  .ramp-row { display:flex; align-items:flex-start; gap:5px; margin-top:9px; }
  .ramp-col { flex:1; min-width:0; }
  .panel .pal-btn { display:flex; align-items:center; gap:3px; flex:0 0 auto; width:auto;
                    margin:3px 0 0; padding:1px 2px; background:none; border:1px solid #bbb;
                    border-radius:3px; cursor:pointer; }
  .panel .pal-btn:hover { border-color:#888; }
  .pal-sw { display:block; border-radius:2px; }
  .pal-car { font-size:9px; line-height:1; color:#666; }
  .pal-menu { display:none; position:fixed; z-index:1100; background:#fff; border:1px solid #bbb;
              border-radius:4px; box-shadow:0 3px 10px rgba(0,0,0,0.25); padding:3px; }
  .pal-menu.open { display:block; }
  .panel .pal-menu button { display:flex; align-items:center; gap:6px; width:100%; margin:0;
                            padding:3px 5px; border:0; border-radius:3px; background:none;
                            font-size:11px; text-align:left; cursor:pointer; }
  .panel .pal-menu button:hover:enabled { background:#e8f0fb; }
  .panel .pal-menu button.sel { font-weight:600; }
  .pal-menu .pal-sw { flex:0 0 auto; }
  .seg { display:flex; gap:4px; margin:2px 0 0; }
  .panel .seg button { flex:1; width:auto; display:flex; align-items:center;
                       justify-content:center; gap:4px; margin:0; padding:3px 4px;
                       border:1px solid #ccc; border-radius:3px; background:#f6f6f6;
                       color:#555; font-size:11px; cursor:pointer; }
  .panel .seg button:hover { background:#ececec; }
  .panel .seg button.on { background:#e8f0fb; border-color:#7ea6dc; color:#1a4f8f;
                          font-weight:600; }
  #status { position:absolute; bottom:10px; left:10px; z-index:1000; font-size:11px;
            background:rgba(255,255,255,0.9); padding:3px 7px; border-radius:3px; }
  .lyr-group { font-weight:600; margin:4px 0 2px; }
  .lyr-split { border-top:1px solid #ccc; margin-top:7px; padding-top:6px; }
  .leaflet-control-layers-overlays .lyr-row { padding-left:10px; }
  .leaflet-tooltip.cell-tip { font-size:12px; line-height:1.45; }
  .leaflet-popup-content .pop-body { font-size:12px; line-height:1.5; }
  .leaflet-container a.popup-others { right:24px; }
  .popup-others svg { display:block; margin:5.5px auto; }
  .leaflet-popup-content { margin-right:48px; }
  .pop-body .bd { margin-top:6px; border-top:1px solid #ddd; padding-top:5px; }
  .pop-body .bd-row { display:grid; grid-template-columns:1fr auto 3.2em; gap:6px;
                       align-items:baseline; }
  .pop-body .bd-row .n, .pop-body .bd-row .pc { text-align:right; font-variant-numeric:tabular-nums; }
  .pop-body .bd-row .nm { overflow-wrap:anywhere; }
  .pop-body .bd-row .rk { color:#777; }
  .pop-body .bd-note { color:#666; margin-top:3px; }
  .pop-body .bd-warn { color:#a00; }

  /* ---- taxon autocomplete ---- */
  .ac { position:relative; }
  .ac-list {
    display:none; position:fixed; z-index:1100;
    background:#fff; border:1px solid #bbb; border-radius:4px;
    overflow-y:auto; box-shadow:0 3px 10px rgba(0,0,0,0.25);
  }
  .ac-list.open { display:block; }
  .ac-item { display:flex; align-items:center; gap:7px; padding:5px 6px;
             cursor:pointer; border-bottom:1px solid #eee; }
  .ac-item:last-child { border-bottom:0; }
  .ac-item:hover, .ac-item.sel { background:#e8f0fb; }
  .ac-item .thumb { width:34px; height:34px; border-radius:3px; object-fit:cover;
                    flex:0 0 auto; background:#e4e4e4; }
  .ac-item .txt { flex:1; min-width:0; }
  .ac-item .sci { display:block; font-style:italic; color:#222;
                  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ac-item .meta { color:#777; font-size:10px;
                   overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ac-item .cnt { color:#999; font-size:10px; flex:0 0 auto; }
  .panel .ac input { padding:3px 20px 3px 5px; }
  .panel .ac.has-thumb input { padding-left:26px; }
  .ac-thumb { position:absolute; left:3px; top:50%; transform:translateY(-50%);
              width:19px; height:19px; border-radius:3px; object-fit:cover;
              background:#e4e4e4; cursor:help; }
  .panel .ac-x { position:absolute; right:2px; top:50%; transform:translateY(-50%);
                 width:16px; height:16px; margin:0; padding:0; border:0; background:none;
                 color:#999; font-size:14px; line-height:16px; text-align:center; cursor:pointer; }
  .panel .ac-x:hover { color:#c00; }

  /* ---- denominator set chips ---- */
  .chips { display:flex; flex-wrap:wrap; align-content:flex-start; gap:4px;
           height:74px; overflow-y:auto; margin:5px 0 2px;
           border:1px solid #e0e0e0; border-radius:4px; padding:3px; }
  .chip { display:inline-flex; align-items:center; gap:4px; max-width:100%;
          background:#eef2f7; border:1px solid #c9d4e2; border-radius:10px;
          padding:1px 3px 1px 2px; font-size:11px; line-height:1.6; }
  .chip img { width:15px; height:15px; border-radius:50%; object-fit:cover;
              background:#dde; flex:0 0 auto; cursor:help; }
  .chip .nm { font-style:italic; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chip .n { color:#8a97a8; text-decoration:none; }
  .chip a.n:hover { color:#1a5fb4; text-decoration:underline; }
  .panel .chip button { width:13px; height:13px; margin:0; padding:0; border:0; background:none;
                        color:#8a97a8; font-size:13px; line-height:11px; text-align:center;
                        cursor:pointer; flex:0 0 auto; }
  .panel .chip button:hover { color:#c00; }
  .chips .empty { color:#a00; font-size:11px; }
  .chips .empty.wait { color:#999; }

  /* ---- taxon diagnostic ---- */
  .diag { margin-top:7px; font-size:11px; line-height:1.4; color:#555;
          background:#f0f2f5; border:1px solid #dfe3e8; border-radius:4px; padding:4px 6px; }
  .diag:empty { display:none; }
  .diag.warn { color:#7a4a00; background:#fdf6e7; border-color:#eedcb3; }
  .diag .d-key { font-weight:600; }
  .diag .d-why { margin-top:2px; }
  .panel .diag .d-sum { display:flex; align-items:baseline; gap:4px; width:100%; margin:0;
                        padding:0; border:0; background:none; font:inherit; color:inherit;
                        text-align:left; cursor:pointer; }
  .panel .diag .d-sum:hover { color:#222; }
  .diag .d-caret { display:inline-block; margin-left:auto; color:#999; }
  .diag.open .d-caret { transform:rotate(90deg); }
  .diag .d-body { display:none; }
  .diag.open .d-body { display:block; margin-top:3px; }

  /* ---- taxon hover card ---- */
  #taxcard { position:fixed; z-index:1200; width:230px; display:none; overflow:hidden;
             background:#fff; border:1px solid #bbb; border-radius:6px; font-size:12px;
             line-height:1.45; box-shadow:0 6px 20px rgba(0,0,0,0.25); }
  #taxcard.open { display:block; }
  #taxcard .photo { width:100%; aspect-ratio:1; object-fit:cover; display:block; background:#eee; }
  #taxcard .attr { font-size:9px; color:#777; padding:3px 8px 0; line-height:1.3; }
  #taxcard .attr a { color:inherit; }
  #taxcard .body { padding:6px 8px 8px; }
  #taxcard .sci { font-size:13px; }
  #taxcard .sci.italic { font-style:italic; }
  #taxcard .common { color:#666; }
  #taxcard .meta { color:#888; font-size:11px; margin-top:2px; }
  #taxcard .more { display:block; margin-top:5px; color:#1a5fb4; text-decoration:none; }
  #taxcard .more:hover { text-decoration:underline; }
  .panel .swap { margin-top:4px; padding:3px; font-size:11px; }
  .panel button:disabled { opacity:0.45; cursor:default; }

  /* ---- help modal ---- */
  .help-modal { display:none; position:fixed; inset:0; z-index:2000; align-items:center;
                justify-content:center; padding:20px; box-sizing:border-box; }
  .help-modal.open { display:flex; }
  .help-modal-overlay { position:absolute; inset:0; background:rgba(0,0,0,0.5); cursor:pointer; }
  .help-modal-box { position:relative; width:100%; max-width:680px; max-height:90vh; background:#fff;
                    border-radius:8px; box-shadow:0 4px 24px rgba(0,0,0,0.25); }
  .help-modal-close { position:absolute; top:8px; right:8px; z-index:1; width:32px; height:32px;
                      padding:0; border:0; border-radius:6px; background:#e8e8e8; color:#555;
                      font-size:20px; line-height:1; cursor:pointer; }
  .help-modal-close:hover { background:#ddd; color:#333; }
  .help-modal-box iframe { display:block; width:100%; height:80vh; min-height:400px; border:0;
                           border-radius:8px; }

  /* ---- pinned actions ---- */
  .panel-foot { flex:0 0 auto; border-top:1px solid #ddd; margin:8px 12px 0; padding-top:7px; }
  .panel.collapsed .panel-foot { display:none; }
  .panel .panel-foot button { margin-top:0; }
  .btn-row { display:flex; flex-wrap:wrap; gap:5px; }
  .panel .btn-row button { flex:1 1 auto; width:auto; min-width:0; }
  .panel .btn-row.even button { flex-basis:0; }
  .panel .btn-row button.copied { color:#2e7d32; }
</style>
</head>
<body>
<div id="map"></div>

<!-- ==== control panel ==== -->
<div class="panel" id="panel">
  <div class="panel-inner">
  <h1>Local outlier map<a href="#" class="help-link" id="helpOpen">help</a></h1>

  <!-- ==== two bands: what is compared, and how the cells are filtered and drawn -->
  <div class="band band-compare">
  <div class="sect">set comparison taxa</div>

  <!-- ==== the audited taxon ==== -->
  <label for="in_preset">Examples</label>
  <select id="in_preset">
    <option value="">&mdash; pick a taxon, or type below &mdash;</option>
    <option value="46017">Eastern Gray Squirrel</option>
    <option value="42888">Eastern Grey Kangaroo</option>
    <option value="5212">Red-tailed Hawk</option>
    <option value="64968">American Toad</option>
    <option value="43794">American Beaver</option>
    <option value="28362">Common Garter Snake</option>
    <option value="55990">Common Wall Lizard</option>
    <option value="48548">Painted Lady</option>
    <option value="4270">Great Cormorant</option>
    <option value="69756">Atlantic White Cedar</option>
  </select>
  <label for="in_a">Audited taxon<button type="button" class="toggle" id="autofit"
      aria-pressed="false" title="Auto-fit the map when setting a new audited taxon."
      >auto</button><button type="button" class="fit" id="fitview"
      title="Fit the map to this taxon's observations."
      >&#10530; fit</button></label>
  <div class="ac" id="wrap_a">
    <img class="ac-thumb" id="th_a" alt="" hidden>
    <input id="in_a" placeholder="type a species name&hellip;" autocomplete="off">
    <button type="button" class="ac-x" id="x_a" title="Clear"
        aria-label="Clear audited taxon" hidden>&times;</button>
    <div class="ac-list" id="ac_a"></div>
  </div>

  <!-- ==== the denominator set ==== -->
  <label for="in_seed">Confusion set<span class="tip"
      title="Taxa confused with the audited taxon. Measured as observations of the confusion taxon which also carry an identification of the audited taxon."
      >&#9432;</span></label>
  <select id="in_seed">
    <option value="cumul:0.8">top 80% of confusions</option>
    <option value="cumul:0.9">top 90% of confusions</option>
    <option value="cumul:0.95">top 95% of confusions</option>
    <option value="top:1">most-confused taxon only</option>
    <option value="top:3">top 3 taxa</option>
    <option value="top:5">top 5 taxa</option>
  </select>
  <label>Seed confusion partners from<span class="tip"
      title="Which identifications of the audited taxon count. Current + withdrawn is only available globally and at rank species."
      >&#9432;</span></label>
  <div class="seg" id="seg_seedsrc"></div>
  <div class="chips" id="chips"></div>
  <div class="ac" id="wrap_add">
    <input id="in_add" placeholder="add another taxon&hellip;" autocomplete="off">
    <div class="ac-list" id="ac_add"></div>
  </div>
  <div class="btn-row even">
    <button class="swap" id="reseed"
        title="Discard all current seeds and re-seed from the audited taxon's global confusions."
        >&#8635; re-seed</button>
    <button class="swap" id="reseed_view"
        title="Discard all current seeds and re-seed from the audited taxon's confusions inside the current viewport. Use it where a locally important confusion is outranked globally. Only available with current IDs."
        >&#8635; re-seed in view</button>
  </div>

  </div>

  <!-- ==== the cells ==== -->
  <div class="band band-paint">
  <div class="sect">filter and draw cells</div>
  <label>Cell count<span class="tip" title="Select which count sets the cell value."
      >&#9432;</span></label>
  <div class="seg" id="seg_countaxis"></div>
  <label>Show as<span class="tip"
      title="Show the cell count as color intensity or square size."
      >&#9432;</span></label>
  <div class="seg" id="seg_channel"></div>

  <!-- ==== the share band the color spans ==== -->
  <div class="ramp-row">
    <div class="ramp-col">
      <div class="ramp" id="ramp"><div class="grip" id="grip_lo"></div><div class="grip" id="grip_hi"></div></div>
      <div class="ramp-ticks" id="ramp_ticks"></div>
      <div class="ramp-labels"><span>all confusion set</span><span id="lbl_a">all</span></div>
    </div>
    <button type="button" class="pal-btn" id="pal_btn" title="Color ramp" aria-haspopup="true"
      ><span class="pal-sw" id="pal_sw"></span><span class="pal-car">&#9662;</span></button>
  </div>
  <div class="pal-menu" id="pal_menu"></div>

  <!-- ==== which cells count, and how the count scales ==== -->
  <div class="row">
    <div><label for="in_minset">Min set<span class="tip"
        title="Cells holding fewer confusion-set observations than this are left blank."
        >&#9432;</span></label><input id="in_minset" type="number" min="0"></div>
    <div><label for="in_countcap">Full visual at<span class="tip"
        title="The count at which the cell reaches full intensity/full size. Above this, every cell is at maximum, below this, the cells scale by their count."
        >&#9432;</span><button type="button" class="fit" id="fitcap"
        title="Re-scale according to the values of the cells in the current viewport."
        >&#8597; fit</button></label><input id="in_countcap" type="number" min="2"></div>
  </div>
  <div class="row top">
    <div><label for="in_acc">Max uncertainty (m)<span class="tip"
        title="Keep only observations with uncertainty below this, or with no uncertainty value. Cannot be raised beyond mappable, which is ~31 km at the equator, less toward the poles."
        >&#9432;</span></label><input id="in_acc" type="number" min="1" step="1"
        placeholder="mappable"></div>
    <div><label>Quality grade</label>
      <div class="check-row" id="qg_checks"></div>
    </div>
  </div>
  <label class="check" id="lbl_nosign" for="in_nosign" hidden
      ><input type="checkbox" id="in_nosign">Exclude annotated sign<span class="tip"
      title="Drop observations annotated as tracks, scat, bone, etc."
      >&#9432;</span></label>

  <label class="check" id="lbl_lock" for="in_lock"
      ><input type="checkbox" id="in_lock">Lock grid zoom<span class="tip"
      title="Freeze the cells at the current zoom, so zooming in magnifies them instead of recomputing a finer grid. Zooming out past the locked level goes back to following the map."
      >&#9432;</span><span class="lock-note" id="lock_note"></span></label>
  </div>

  </div>

  <!-- ==== actions ==== -->
  <div class="panel-foot">
    <div class="btn-row">
      <button class="swap" id="drawbox"
          title="Drag a rectangle to count a whole region instead of one cell."
          >&#9645; draw box</button>
      <button class="swap" id="refresh"
          title="Bypass tile cache and fetch new tiles. Useful after you've made correcting IDs."
          >&#8635; refresh tiles</button>
      <button class="swap" id="copyShare" title="Copy a link to the current view"
          >&#10697; share link</button>
    </div>
    <div class="diag" id="diag"></div>
  </div>
  <button type="button" class="panel-tab" id="panelToggle" title="Collapse panel">&#94;</button>
</div>

<!-- Filled from JS: the seed/throttle line, and the taxon hover card. -->
<div id="status" hidden></div>
<div id="taxcard"></div>
<div class="help-modal" id="helpModal" role="dialog" aria-modal="true" aria-label="Help" aria-hidden="true">
  <div class="help-modal-overlay" id="helpModalOverlay"></div>
  <div class="help-modal-box">
    <button type="button" class="help-modal-close" id="helpModalClose" aria-label="Close help">&times;</button>
    <iframe id="helpIframe" title="Help"></iframe>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
"use strict";

// ---- settings from the URL -----------------------------------------------
// CFG is what this page decides, FILTERS what is handed to the API untouched;
// syncUrl writes both back.
var qs = new URLSearchParams(location.search);
function clamped(k, d, lo, hi) { var v = parseFloat(qs.get(k)); return v >= lo && v <= hi ? v : d; }
function oneOf(k, allowed, d) { var v = qs.get(k); return allowed.indexOf(v) === -1 ? d : v; }
function taxonParam(k, d) { var v = qs.get(k); return /^\d+$/.test(v || "") ? v : d; }
function intOrNull(k, lo, hi) { var v = parseInt(qs.get(k), 10); return v >= lo && v <= hi ? v : null; }
// null means no set in the link, which seeds on load; an explicitly empty list stays empty
function setParam(k) {
  var v = qs.get(k);
  if (v == null) return null;
  return v.split(",").filter(function (s) { return /^\d+$/.test(s); });
}

// set defaults
var CFG = {
  taxonA:    taxonParam("taxon_id", "46017"),       // Eastern Gray Squirrel
  setIds:    setParam("taxon_set"),                 // null until seeded
  seed:      oneOf("seed", ["cumul:0.8", "cumul:0.9", "cumul:0.95", "top:1", "top:3", "top:5"], "top:5"),
  withdrawn: oneOf("withdrawn", ["0", "1"], "0") === "1",

  for (var a = parent[taxonId]; a != null; a = parent[a]) ancestor[a] = true;

  var rl = level[taxonId] || 10;

}
function putBox(p, box) {
  if (box) ["swlat", "swlng", "nelat", "nelng"].forEach(function (k) { p.set(k, box[k]); });
  return p;
}
// bounds is the viewport re-seed's, and optional.
function boxOf(bounds) {
  // whole world; the bbox would say nothing
  if (!bounds || bounds.getEast() - bounds.getWest() >= 360) return null;
  return { swlat: Math.max(-85, bounds.getSouth()), swlng: wrapLng(bounds.getWest()),
           nelat: Math.min(85, bounds.getNorth()), nelng: wrapLng(bounds.getEast()) };
}

// Membership is gated on the confusion ratio ε, which is confusions / the taxon's own observations,
// not raw count: any abundant taxon collects a handful of stray IDs and would swamp
// the denominator. The count floor catches the mirror case, where that handful
// gives a rare taxon a large ε. Order stays raw count, which thresholds slice.
// Thresholds were fitted using 126 taxa, and validated against 64 hold-back taxa.
var EPS_FLOOR = 1 / 20;                        // must be at least 1/20th as confusable as top taxon
var EPS_PRICED = 30;
var MIN_CONF = 3, MIN_CONF_SHARE = 0.01;
var CEILING_MIN_OWN = 1000;                    // don't let uncommon taxa set high ε
var ABUNDANT = 200000, ABUNDANT_EPS = 0.0003;  // a big taxon needs an absolute ε

function priceSeed(rows, p) {
  var head = rows.slice(0, EPS_PRICED);
  // No row clears the count floor: an answer, not a failure.
  if (!head.length || head[0].count < MIN_CONF) return Promise.resolve([]);
  var q = new URLSearchParams(p);
  q.delete("ident_taxon_id");
  q.set("taxon_id", head.map(function (r) { return r.taxon.id; }).join(","));
  return retryJson("https://api.inaturalist.org/v2/observations/taxonomy?" + q.toString())
    .then(function (j) {
      // Without ε there is no defensible way to choose taxa, so fail the seed
      // rather than fall back to raw count.
      if (!j || !j.results) throw new Error("unpriced");
      // Every node, not just species. One with no own-count prices at ε 0 and is dropped.
      var own = {}, inSet = {};
      j.results.forEach(function (n) { own[n.id] = n.descendant_obs_count; });
      head.forEach(function (r) { inSet[r.taxon.id] = true; });
      // r.count already excludes the taxa nested inside this one, so its own count
      // must too, or a container is priced over a subtree it was not credited with.
      var ownNested = nestedCounts(j.results, inSet);
      head.forEach(function (r) {
        own[r.taxon.id] = (own[r.taxon.id] || 0) - (ownNested[r.taxon.id] || 0);
      });
      var eps = head.map(function (r) {
        return own[r.taxon.id] > 0 ? r.count / own[r.taxon.id] : 0;
      });
      // The ceiling comes from one row, so a wrong one raises the bar for the whole
      // set: it must clear the count floor and have observations enough to price ε.
      var floor = Math.max(MIN_CONF, MIN_CONF_SHARE * head[0].count);
      var top = 0, topAny = 0;
      eps.forEach(function (e, i) {
        if (head[i].count < floor) return;
        if (e > topAny) topAny = e;
        if (own[head[i].taxon.id] >= CEILING_MIN_OWN && e > top) top = e;
      });
      if (!top) top = topAny;
      // A zero ceiling means the own-counts never arrived.
      if (!top) throw new Error("unpriced");
      var kept = head.filter(function (r, i) {
        return eps[i] >= top * EPS_FLOOR && r.count >= floor &&
               (own[r.taxon.id] < ABUNDANT || eps[i] >= ABUNDANT_EPS);
      });
      // The abundance rule can evict the row that set the ceiling.
      return kept.length ? kept
                         : head.filter(function (r, i) { return eps[i] === top; }).slice(0, 1);
    });
}

// Call for current and withdrawn IDs. Obs can be represented multiple times (if they
// have multiple IDs). v1 only, and it takes no bbox, so a viewport seed cannot ask it.
// Offered for species audits only because ssp are rolled up and coarse taxa are dropped
// if they're not leaves.
function countsRows(taxonId) {
  var p = new URLSearchParams({ taxon_id: taxonId, current: "any",
                                quality_grade: "needs_id,research", per_page: "500" });
  return retryJson("https://api.inaturalist.org/v1/identifications/species_counts?" + p)
    .then(function (j) {
      if (!j || !j.results) throw new Error("no results");
      return j.results
        .filter(function (e) {
          return e.taxon.rank_level === 10 && String(e.taxon.id) !== taxonId;
        })
        .map(function (e) { return { count: e.count, taxon: e.taxon }; })
        .sort(function (a, b) { return b.count - a.count; });
    });
}

function withdrawnOk() {
  var t = TAXA[CFG.taxonA];
  return !t || t.rank_level == null || t.rank_level === 10;
}
function seedSrcNow() { return withdrawnOk() && CFG.withdrawn ? "both" : "current"; }

function fetchSeed(taxonId, bounds) {
  // Keyed on the whole query, so a re-seed at a new scope refetches while a
  // threshold change re-slices what is already in hand.
  var box = boxOf(bounds), p = putBox(seedFilters(), box);
  var wantBoth = seedSrcNow() === "both";
  var key = String(taxonId) + "|" + (wantBoth ? "any|" : "") + p.toString();
  if (seedFor === key) return Promise.resolve(SEED_ROWS);
  setSeeding(true);
  p.set("ident_taxon_id", taxonId);
  p.set("fields", SEED_FIELDS);
  var pending = wantBoth ? countsRows(taxonId)
    : retryJson("https://api.inaturalist.org/v2/observations/taxonomy?" + p.toString())
        .then(function (j) {
          if (!j || !j.results) throw new Error("no results");
          return seedRowsFrom(j.results, taxonId);
        });
  var raw = [];
  return pending.then(function (r) { raw = r; return priceSeed(r, p); })
    .then(function (rows) {
      if (taxonId !== CFG.taxonA) return null;
      // Every row the seed saw, so a hand-added taxon reads like the rest.
      SEED_COUNTS = {};
      raw.forEach(function (r) { SEED_COUNTS[r.taxon.id] = r.count; });
      SEED_RAW = raw;
      // name and rank only, which refreshTaxa then adds to
      rows.forEach(function (r) { TAXA[r.taxon.id] = TAXA[r.taxon.id] || r.taxon; });
      SEED_ROWS = rows;
      seedFor = key;
      // Kept so the chip links ask over the same ground the counts were taken on.
      seedBox = box;
      seedTaxon = taxonId;
      return rows;
    })
    // null, not [], so a failed request stays distinguishable from a taxon with
    // no confusions. seedFor is left unset, so the next call retries.
    .catch(function () { return null; })
    .then(function (rows) { setSeeding(false); return rows; });
}
// A seeded row's count excludes the rows nested inside it, so a chip must exclude the
// same ones, plus A. Rank stands in for ancestry: only a finer taxon can nest inside.
function seedExclusions(id) {
  var lvl = (TAXA[id] || {}).rank_level, out = [CFG.taxonA];
  // A failed seed leaves SEED_RAW holding the previous taxon's rows.
  if (lvl != null && seedTaxon === CFG.taxonA)
    SEED_RAW.forEach(function (r) {
      if (r.taxon.rank_level < lvl) out.push(String(r.taxon.id));
    });
  return out.join(",");
}

// fill a hand-added taxon
function fillSeedCount(id) {
  if (SEED_COUNTS[id] != null) return;
  var both = seedSrcNow() === "both";
  var p = both ? withdrawnParams(id) : chipParams(id, "taxon_id");
  p.set("per_page", "0");
  if (!both) p.set("fields", "id");
  var taxon = CFG.taxonA;
  retryJson("https://api.inaturalist.org/" + (both ? "v1/identifications?" : "v2/observations?") + p)
    .then(function (j) {
      if (!j || taxon !== CFG.taxonA) return;
      SEED_COUNTS[id] = j.total_results;
      renderChips();
    });
}
// Cumulative thresholds follow the shape of the distribution, which varies by
// taxon; top-N is a flat cut
function sliceSeed(rows, seed) {
  var s = (seed || CFG.seed).split(":"), v = parseFloat(s[1]);
  if (s[0] === "top") return rows.slice(0, v).map(function (r) { return String(r.taxon.id); });
  var total = rows.reduce(function (n, r) { return n + r.count; }, 0);
  var out = [], cum = 0;
  for (var i = 0; i < rows.length; i++) {
    out.push(String(rows[i].taxon.id));
    cum += rows[i].count;
    if (cum / total >= v) break;
  }
  return out;
}
// don't include the input panel when calculating viewport
function panelPad() {
  return document.getElementById("panel").getBoundingClientRect().right -
         map.getContainer().getBoundingClientRect().left + 6;
}
function visibleBounds() {
  var size = map.getSize();
  return L.latLngBounds(map.containerPointToLatLng([panelPad(), size.y]),
                        map.containerPointToLatLng([size.x, 0]));
}

// withdrawnOk reads rank
function ranked() {
  var t = TAXA[CFG.taxonA];
  if (!CFG.withdrawn || (t && t.rank_level != null)) return Promise.resolve();
  setSeeding(true);
  return refreshTaxa();
}
// runDiag needs A's rank
function reseed(bounds) {
  return ranked().then(function () { return fetchSeed(CFG.taxonA, bounds); })
    .then(function (rows) {
      if (rows) CFG.setIds = sliceSeed(rows);
      var named = refreshTaxa();
      applyPanel();
      return named;
    }).then(runDiag);
}

// ---- taxon diagnostic ----------------------------------------------------
// do confusions resolve or move to coarser ranks?
// are there a lot of non-organism obs?

var DIAG_FILTERS = "verifiable=true&mappable=true&spam=false";
var DIAG_PARTNERS = 3;
var DIAG_COARSE_SHARE = 0.5;      // set a cutoff for "many move coarse"
var DIAG_MIN_ANNOTATED = 30;      // set a cutoff for annotated obs
var DIAG_SIGN_SHARE = 0.25;       // set a cutoff for sign annotated obs
var diagFor = null;
var HOMOGENEOUS = [29, 32];       // galls, leafmines

function diagPartner(taxonA, memberId, lim) {
  return retryJson("https://api.inaturalist.org/v2/observations/taxonomy?" +
        DIAG_FILTERS + "&ident_taxon_id_exclusive=" +
        encodeURIComponent(taxonA + "," + memberId) + "&fields=" +
        encodeURIComponent("(rank_level:!t,direct_obs_count:!t)"))
    .then(function (j) {
      if (!j || !j.results) return null;
      var total = 0, coarse = 0;
      j.results.forEach(function (r) {
        total += r.direct_obs_count || 0;
        if (r.rank_level > lim) coarse += r.direct_obs_count || 0;
      });
      return { contested: total, coarse: coarse };
    });
}
// Scoped to the audited taxon
function diagSign(taxonA) {
  return retryJson("https://api.inaturalist.org/v2/observations/popular_field_values?" +
        DIAG_FILTERS + "&taxon_id=" + taxonA + "&no_histograms=true&fields=" +
        encodeURIComponent("(count:!t,controlled_attribute:(id:!t),controlled_value:(id:!t))"))
    .then(function (j) {
      var annotated = 0, sign = 0, top = 0, topId = null;
      ((j && j.results) || []).forEach(function (r) {
        if ((r.controlled_attribute || {}).id !== 22) return;
        annotated += r.count || 0;
        if ((r.controlled_value || {}).id === 24) return;
        sign += r.count || 0;
        if (r.count > top) { top = r.count; topId = (r.controlled_value || {}).id; }
      });
      return { annotated: annotated, sign: sign,
               mixed: HOMOGENEOUS.indexOf(topId) === -1 };
    });
}
function fetchDiag(taxonA, members, auditLevel) {
  var lim = auditLevel || 10;
  return Promise.all(members.map(function (m) { return diagPartner(taxonA, m.id, lim); })
                            .concat([diagSign(taxonA)]))
    .then(function (res) {
      var sign = res.pop(), parts = [], contested = 0, coarse = 0;
      res.forEach(function (r, i) {
        if (!r || !r.contested) return;
        parts.push({ taxon: members[i], contested: r.contested,
                     reached: (r.contested - r.coarse) / r.contested });
        contested += r.contested;
        coarse += r.coarse;
      });
      if (!parts.length) return null;
      return { contested: contested, coarse: coarse, reached: (contested - coarse) / contested,
               parts: parts, annotated: sign.annotated, sign: sign.sign, mixed: sign.mixed };
    });
}
function diagIdentifyUrl(taxonId) {
  return identifyUrl(new URLSearchParams({ mappable: "true", lrank: "complex",
                                           ident_taxon_id: taxonId }));
}
var diagOpen = false;
document.getElementById("diag").addEventListener("click", function (e) {
  if (!e.target.closest || !e.target.closest(".d-sum")) return;
  diagOpen = !diagOpen;
  this.classList.toggle("open", diagOpen);
});
var signy = false;
function setSigny(on) {
  signy = on;
  if (!on && signExcluded()) { setSignExcluded(false); applyPanel(); }
  syncSignBox();
}
function syncSignBox() {
  document.getElementById("in_nosign").checked = signExcluded();
  document.getElementById("lbl_nosign").hidden = !signy;
}
document.getElementById("in_nosign").addEventListener("change", function () {
  setSignExcluded(this.checked);
  syncSignBox();
  applyPanel();
});
// A taxon change leaves no mark on the ID it withdrew, but its replacement carries one.
var WD_SAMPLE = 20, WD_MIN_HITS = 3;
var IDENT_URL = "https://api.inaturalist.org/v1/identifications";
var IDENT_QG = "needs_id,research";

function splitPartners(taxonId) {
  var t = TAXA[taxonId] || {};
  if (seedSrcNow() !== "both" || !t.taxon_changes_count) return Promise.resolve([]);
  var p = new URLSearchParams({ taxon_id: taxonId, current: "false", order_by: "id",
      order: "asc", per_page: WD_SAMPLE, quality_grade: IDENT_QG });
  return retryJson(IDENT_URL + "?" + p).then(function (j) {
    var rows = (j && j.results) || [], pairs = {}, obs = {};
    rows.forEach(function (r) {
      pairs[r.observation.id + "/" + r.user.id] = 1;
      obs[r.observation.id] = 1;
    });
    if (!rows.length) return [];
    var q = new URLSearchParams({ observation_id: Object.keys(obs).join(","), is_change: "true",
        current: "any", per_page: "200", quality_grade: IDENT_QG });
    return retryJson(IDENT_URL + "?" + q).then(function (k) {
      var hits = {};
      ((k && k.results) || []).forEach(function (r) {
        if (!r.taxon_change || String(r.taxon.id) === String(taxonId)) return;
        if (!pairs[r.observation.id + "/" + r.user.id]) return;
        hits[r.taxon.id] = (hits[r.taxon.id] || 0) + 1;
      });
      return Object.keys(hits).filter(function (id) { return hits[id] >= WD_MIN_HITS; })
        .sort(function (a, b) { return hits[b] - hits[a]; });
    });
  });
}
// The identifications endpoint returns a lean taxon, so names come from the seed.
function partnerName(id) {
  var t = TAXA[id];
  SEED_RAW.forEach(function (r) { if (!t && String(r.taxon.id) === id) t = r.taxon; });
  return chipName(t || { id: id });
}
function splitNote(ids) {
  return ids.map(function (id) { return esc(partnerName(id)); }).join(" and ") +
    " split from this taxon and the confusion count includes identifications auto-withdrawn " +
    "by the split. Seed from current IDs, or add partners by hand.";
}

function renderDiag(d, rank, partners) {
  var el = document.getElementById("diag");
  var why = partners && partners.length ? [splitNote(partners)] : [];
  if (!d) {
    el.className = "diag" + (why.length ? " warn" : "");
    el.innerHTML = why.length ? '<div class="d-why">' + why[0] + "</div>" : "";
    setSigny(false);
    return;
  }
  var note = [], n = d.parts.length;
  var self = esc(chipName(TAXA[CFG.taxonA] || { id: CFG.taxonA }));
  if (1 - d.reached >= DIAG_COARSE_SHARE)
    why.push("Identify coarse observations carrying an ID of " + self + ' <a href="' +
             diagIdentifyUrl(CFG.taxonA) + '" target="_blank" rel="noopener">here</a>');
  var signHeavy = d.mixed && d.annotated >= DIAG_MIN_ANNOTATED &&
                  d.sign / d.annotated >= DIAG_SIGN_SHARE;
  setSigny(signHeavy);
  if (signHeavy)
    note.push(Math.round(100 * d.sign / d.annotated) + "% of annotated observations are sign.");
  var seg = [
    d.contested.toLocaleString() + " observations carry IDs of " +
      (n === 1 ? "both " + self + " and " + esc(chipName(d.parts[0].taxon))
               : self + " and one of its top " + n + " confusions (" +
                 d.parts.map(function (p) { return esc(chipName(p.taxon)); }).join(", ") + ")"),
    '<span class="d-key">' + d.coarse.toLocaleString() + " stopped above " + esc(rank) +
      " agreement</span>"
  ];
  if (n > 1) {
    var by = d.parts.slice().sort(function (a, b) { return b.reached - a.reached; });
    var pct = function (p) { return Math.round(p.reached * 100) + "% (" + esc(chipName(p.taxon)) + ")"; };
    seg.push("range: " + pct(by[0]) + " to " + pct(by[n - 1]) + " reaching " + esc(rank) + " agreement");
  }
  el.className = "diag" + (why.length ? " warn" : "") + (diagOpen ? " open" : "");
  el.innerHTML =
    '<button type="button" class="d-sum"><span><strong>' +
    (d.contested - d.coarse).toLocaleString() + "</strong> of " + d.contested.toLocaleString() +
    " reached " + esc(rank) + '</span><span class="d-caret">&#9656;</span></button>' +
    '<div class="d-body"><div>' + seg.join(" · ") + "</div>" +
    why.concat(note).map(function (w) { return '<div class="d-why">' + w + "</div>"; }).join("") +
    "</div>";
}
function runDiag() {
  var el = document.getElementById("diag");
  // A failed seed leaves SEED_ROWS holding the *previous* taxon's confusions.
  var rows = seedTaxon === CFG.taxonA ? SEED_ROWS.slice(0, DIAG_PARTNERS) : [];
  var members = rows.map(function (r) { return r.taxon; });
  if (!members.length) { diagFor = null; renderDiag(null); return; }
  // The seed source is in the key: only withdrawn IDs carry the split warning.
  var key = CFG.taxonA + "/" + seedSrcNow() + "/" +
            members.map(function (t) { return t.id; }).join(",");
  if (diagFor === key) return;
  diagFor = key;
  el.className = "diag";
  el.textContent = "checking what this taxon's confusions look like…";
  var self = TAXA[CFG.taxonA] || {};
  Promise.all([fetchDiag(CFG.taxonA, members, self.rank_level), splitPartners(CFG.taxonA)])
    .then(function (r) {
      // taxon moved on while in flight
      if (diagFor === key) renderDiag(r[0], self.rank || "species", r[1]);
    });
}

function chipName(t) {
  if (!t || !t.name) return shortName(t);
  var parts = t.name.split(" ");
  if (parts.length < 2 || (t.rank_level != null && t.rank_level > 20)) return t.name;
  return parts[0].charAt(0) + ". " + parts.slice(1).join(" ");
}

function withdrawnParams(id) {
  return new URLSearchParams({ taxon_id: CFG.taxonA, observation_taxon_id: id, current: "any",
                               quality_grade: "needs_id,research",
                               without_observation_taxon_id: seedExclusions(id) });
}
function chipParams(id, key) {
  var p = putBox(seedFilters(), seedBox);

// Withdrawn IDs have no page on iNat, so this goes to pisum's viewer.
function seedIdentificationsUrl(id) {

}

function renderChips() {

// in priority order: observation pin, then drawn box, then cell underneath
var tip = null;

function breakdownBody(info) {

    var title = longName(TAXA[m.id] || m) +

// Web Mercator stops at ±85.0511° and the tiles clamp anything poleward into the
// grid's edge row, which no bbox can reach — so in the top and bottom rows of the
// world these counts and the tile's legitimately disagree.
var TREE_FIELDS = "(id:!t,name:!t,rank:!t,rank_level:!t,parent_id:!t," +
  "direct_obs_count:!t,descendant_obs_count:!t)";
function fetchTree(box) {
  var p = putBox(baseFilters(), box);
  p.set("taxon_id", [CFG.taxonA].concat(setIds()).join(","));
  p.set("fields", TREE_FIELDS);
  // ttl=1 drops the 5-minute cache to 1s, so counts reflect IDs just corrected.
  p.set("ttl", "1");
  return retryJson("https://api.inaturalist.org/v2/observations/taxonomy?" + p.toString())
    .then(function (j) { return j && j.results ? readTree(j.results) : null; });
}
// The queried taxa are disjoint, so every observation sits under exactly one and the
// tree decomposes the cell with no residual. direct_obs_count is what stopped at a
// node, descendant_obs_count its whole subtree.
function readTree(rows) {
  var by = {}, total = 0;
  rows.forEach(function (r) { by[r.id] = r; total += r.direct_obs_count || 0; });
  var an = by[CFG.taxonA], a = an ? an.descendant_obs_count || 0 : 0;
  function inside(ancestorId, node) {
    while (node && by[node.parent_id]) {
      node = by[node.parent_id];
      if (node.id === ancestorId) return true;
    }
    return false;
  }
  // Taxa can nest, so an observation goes to A if it is in A's subtree, else
  // to the deepest taxon containing it, which makes the rows sum to b exactly.
  var mem = [], isMember = {};
  setIds().forEach(function (id) { if (by[id]) { mem.push(by[id]); isMember[by[id].id] = true; } });
  function enclosingMember(n) {
    while (n && by[n.parent_id]) {
      n = by[n.parent_id];
      if (isMember[n.id]) return n.id;
    }
    return null;
  }
  function depth(n) { var d = 0; while (n && by[n.parent_id]) { n = by[n.parent_id]; d++; } return d; }
  var nested = {};
  mem.forEach(function (n) {
    var p = enclosingMember(n);
    if (p !== null) (nested[p] = nested[p] || []).push(n.id);
  });
  // Deepest first, so a taxon's own total is final before its container reads it.
  var attr = {};
  mem.slice().sort(function (x, y) { return depth(y) - depth(x); }).forEach(function (n) {
    // A taxon inside A holds only A's observations, which the map counts on A's side.
    if (an && (n.id === an.id || inside(an.id, n))) { attr[n.id] = 0; return; }
    var c = n.descendant_obs_count || 0;
    if (an && inside(n.id, an)) c -= a;          // A sits inside this taxon
    (nested[n.id] || []).forEach(function (id) { c -= attr[id] || 0; });
    attr[n.id] = c;
  });
  var members = mem.filter(function (n) { return attr[n.id] > 0; })
    .map(function (n) {
      return { id: n.id, name: n.name, rank: n.rank, rank_level: n.rank_level,
               count: attr[n.id],
               // Its subtree minus the taxa inside it
               remainder: !!nested[n.id] };
    })
    .sort(function (x, y) { return y.count - x.count; });
  // Only a taxon with no node at all is absent; one that resolved to zero is
  // present but accounted for elsewhere.
  var absent = setIds().filter(function (id) { return !by[id]; });
  return { a: a, b: total - a, members: members, absent: absent };
}

function attachAutocomplete(input, listEl, onChoose) {
  var timer = null, controller = null, items = [], sel = -1;
  function close() { listEl.classList.remove("open"); listEl.innerHTML = ""; items = []; sel = -1; }
  function choose(t) { onChoose(t); close(); }
  function place() {
    var r = input.getBoundingClientRect();
    listEl.style.left = r.left + "px";
    listEl.style.width = r.width + "px";
    listEl.style.top = (r.bottom + 2) + "px";
    listEl.style.maxHeight = Math.max(90, window.innerHeight - r.bottom - 12) + "px";
  }
  function render() {
    listEl.innerHTML = "";
    items.forEach(function (t, i) {
      var row = document.createElement("div");
      row.className = "ac-item" + (i === sel ? " sel" : "");
      var src = t.default_photo && t.default_photo.square_url;
      var meta = cap(t.rank || "") +
                 (t.preferred_common_name ? " · " + t.preferred_common_name : "");
      row.innerHTML =
        (src ? '<img class="thumb" alt="" loading="lazy" src="' + esc(src) + '">'
             : '<span class="thumb"></span>') +
        '<span class="txt"><span class="sci">' + esc(t.name) + "</span>" +
        '<div class="meta">' + esc(meta) + "</div></span>" +
        '<span class="cnt">' + Number(t.observations_count || 0).toLocaleString() + "</span>";
      row.addEventListener("mousedown", function (ev) { ev.preventDefault(); choose(t); });
      listEl.appendChild(row);
    });
    listEl.classList.toggle("open", items.length > 0);
    if (items.length) place();
    if (listEl.children[sel]) listEl.children[sel].scrollIntoView({ block: "nearest" });
  }
  document.querySelector(".panel-inner").addEventListener("scroll", close);
  window.addEventListener("resize", close);
  input.addEventListener("input", function () {
    if (input === elA) { input.dataset.id = ""; decorBox(null); }
    var q = input.value.trim();
    clearTimeout(timer);
    if (controller) controller.abort();
    if (q.length < 3) { close(); return; }
    timer = setTimeout(function () {
      controller = new AbortController();
      retryJson("https://api.inaturalist.org/v2/taxa/autocomplete?per_page=8&q=" + encodeURIComponent(q) +
            "&fields=" + encodeURIComponent(TAXON_FIELDS), controller.signal)
        .then(function (j) { items = (j && j.results) || []; sel = -1; render(); });
    }, 300);
  });
  input.addEventListener("keydown", function (e) {
    if (!items.length) return;
    if (e.key === "ArrowDown") { sel = Math.min(sel + 1, items.length - 1); render(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { sel = Math.max(sel - 1, 0); render(); e.preventDefault(); }
    else if (e.key === "Enter" && sel >= 0) { choose(items[sel]); e.preventDefault(); }
    else if (e.key === "Escape") close();
  });
  input.addEventListener("blur", function () { setTimeout(close, 120); });
}

function scheduleCardHide() {
  clearTimeout(cardShow); clearTimeout(cardHide);
  cardHide = setTimeout(hideCard, 200);
}
function attachCard(anchor, getRec) {
  anchor.addEventListener("mouseenter", function () {
    clearTimeout(cardHide); clearTimeout(cardShow);
    cardShow = setTimeout(function () {
      var t = getRec();
      if (!t || !t.name) return;
      renderCard(t);
      cardEl.classList.add("open");   // measurable only once shown
      placeCard(anchor);
    }, 350);
  });
  anchor.addEventListener("mouseleave", scheduleCardHide);
}
attachCard(document.getElementById("th_a"), function () { return BOX_A; });
cardEl.addEventListener("mouseenter", function () { clearTimeout(cardHide); });
cardEl.addEventListener("mouseleave", scheduleCardHide);
// the card's contents are rewritten on every hover.
cardEl.addEventListener("click", function (e) {
  var a = e.target.closest && e.target.closest(".audit");
  if (!a) return;
  e.preventDefault();
  hideCard();
  applyTaxon(a.getAttribute("data-id"));
});

document.getElementById("in_preset").addEventListener("change", function () {
  if (!this.value) return;
  var id = this.value;
  this.value = "";   // otherwise re-picking the same preset fires no change event
  applyTaxon(id);
});
var GRADES = [{ value: "needs_id", label: "needs ID" },
              { value: "research", label: "research" }];
function gradesOn() {
  var q = FILTERS.quality_grade ? FILTERS.quality_grade.split(",") : null;
  return GRADES.map(function (g) { return g.value; })
               .filter(function (v) { return !q || q.indexOf(v) !== -1; });
}
function renderGrades() {
  var box = document.getElementById("qg_checks"), on = gradesOn();
  box.innerHTML = "";
  GRADES.forEach(function (g) {
    var lbl = document.createElement("label"), cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = on.indexOf(g.value) !== -1;
    cb.disabled = cb.checked && on.length === 1;
    lbl.className = "check" + (cb.disabled ? " off" : "");
    cb.addEventListener("change", function () {
      var next = cb.checked ? on.concat([g.value])
                            : on.filter(function (v) { return v !== g.value; });
      if (next.length === GRADES.length) delete FILTERS.quality_grade;
      else FILTERS.quality_grade = next.join(",");
      renderGrades();
      applyPanel();
    });
    lbl.appendChild(cb);
    lbl.appendChild(document.createTextNode(g.label));
    box.appendChild(lbl);
  });
}
var COUNT_AXIS = [
  { value: "set", label: "confusion set",
    title: "The count of observations across the whole confusion set." },
  { value: "audited", label: "audited taxon",
    title: "The count of observations of the audited taxon." }
];
function renderCountAxisSeg() {
  renderSeg("seg_countaxis", COUNT_AXIS, CFG.countAxis, function (v) {
    CFG.countAxis = v;
    renderCountAxisSeg();
    applyPanel();
  });
}
var typedTimer = null;
["in_minset", "in_countcap"].forEach(function (id) {
  document.getElementById(id).addEventListener("input", function () {
    clearTimeout(typedTimer);
    typedTimer = setTimeout(applyPanel, 400);
  });
});
// This one refetches, so it waits for a finished value: change is Enter or blur.
document.getElementById("in_acc").addEventListener("change", applyPanel);
// Hand-added taxa are dropped — that is what re-slicing the seed means.
document.getElementById("in_seed").addEventListener("change", function () {
  CFG.seed = this.value;
  // Re-slice the rows the last seed produced, viewport or global; re-seeding here
  // would rescope a viewport set back to the world. The fetch is only for rows a
  // shared link never loaded.
  if (seedTaxon === CFG.taxonA && SEED_ROWS.length) {
    CFG.setIds = sliceSeed(SEED_ROWS);
    refreshTaxa();
    applyPanel();
  } else {
    reseed();
  }
});
var VIEW_TITLE = document.getElementById("reseed_view").title;
function syncSeedSrc() {
  var b = document.getElementById("reseed_view"), off = seedSrcNow() === "both";
  b.disabled = off;
  b.title = off ? "Only available when seeding from current IDs." : VIEW_TITLE;
}
var SEED_SRC = [
  { value: "current", label: "current",
    title: "Identifications of the audited taxon that are not withdrawn. Chips count observations." },
  { value: "both", label: "current + withdrawn",
    title: "Current and withdrawn identifications. Uses a different method and does *not* produce a superset of the current results. Not available for ranks other than species, or for local viewports. Chips count identifications." }
];
function renderSeedSrcSeg() {
  var off = withdrawnOk() ? null : "Only available for global species audits.";
  var opts = SEED_SRC.map(function (o) {
    return o.value === "both" ? Object.assign({ off: off }, o) : o;
  });
  renderSeg("seg_seedsrc", opts, seedSrcNow(), function (v) {
    CFG.withdrawn = v === "both";
    renderSeedSrcSeg();
    syncSeedSrc();
    reseed();
  });
}
document.getElementById("reseed").addEventListener("click", function () { reseed(); });
document.getElementById("reseed_view").addEventListener("click", function () {
  reseed(visibleBounds());
});
var REFRESH_LABEL = "↻ refresh tiles", refreshTimer = null;
document.getElementById("refresh").addEventListener("click", function () {
  if (!layer || !map.hasLayer(layer)) return;    // no load event to clear it again
  var btn = this;
  map.closePopup();
  layer.options.bust = Date.now();
  layer.once("load", function () { layer.options.bust = null; });
  throttled = 0; gaveUp = 0; setStatus();     // every tile is about to be re-asked
  layer.redraw();
  btn.textContent = "↻ refreshed";
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(function () { btn.textContent = REFRESH_LABEL; }, 1400);
});
function applyPanel() {
  CFG.countCap  = Math.max(2, parseFloat(document.getElementById("in_countcap").value) || 100);
  CFG.minSet    = Math.max(0, parseFloat(document.getElementById("in_minset").value) || 0);

  var acc = Math.floor(parseFloat(document.getElementById("in_acc").value));
  if (acc > 0) FILTERS.acc_below_or_unknown = String(acc);
  else delete FILTERS.acc_below_or_unknown;

  var urlA = gridUrl("a"), urlB = gridUrl("set");
  if (layer && layer.options.urlA === urlA && layer.options.urlB === urlB) {
    layer.repaint();
  } else {
    // removeLayer fires overlayremove on a layer the control knows, clearing
    // cellsShown before it is read.
    var wasVisible = cellsShown;
    if (layer) map.removeLayer(layer);
    throttled = 0; gaveUp = 0; setStatus();
    layer = new CellLayer({ urlA: urlA, urlB: urlB, zIndex: 400,
                            maxNativeZoom: lockedZoom() });
    layer.on("load", noteTileLoad);
    // Only back on if it was showing
    if (wasVisible) layer.addTo(map);
    cellsShown = wasVisible;
    controlKey = null;      // the control is holding the instance just discarded
  }
  renderRamp();
  styleBox(boxRect);       // same scale, so the box follows the palette
  syncOverlayUrls();
  showNames();
  syncUrl();
  syncFitButton();
}

// ---- fitting the count scale ---------------------------------------------
// The top of the count ramp, from the cells on screen. Essentially a 10% clip.
var FIT_PCTL = 0.9;          // not the max, or one city cell flattens the rest
function viewCounts() {
  if (!layer || !map.hasLayer(layer)) return [];
  var seen = {}, vals = [];
  for (var k in layer._tiles) {
    var key = layer.dataKey(layer._tiles[k].coords);
    if (seen[key]) continue;      // a tile on two copies of the world is one tile
    seen[key] = true;
    var td = layer._tileData[key];
    if (!td) continue;
    for (var r = 0; r < td.rows; r++) {
      for (var q = 0; q < td.cols; q++) {
        if (drawable(td.cells[r][q])) vals.push(countOf(td.cells[r][q]));
      }
    }
  }
  return vals;
}
function niceCap(v) {
  var e = Math.pow(10, Math.floor(Math.log10(v))), m = v / e;
  return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * e;
}
// null only where nothing is drawn
function fittedCap() {
  var vals = viewCounts();
  if (!vals.length) return null;
  vals.sort(function (x, y) { return x - y; });
  return Math.max(2, niceCap(vals[Math.min(vals.length - 1,
                                           Math.floor(vals.length * FIT_PCTL))]));
}
function applyFit() {
  var fit = fittedCap();
  if (fit == null) return false;
  document.getElementById("in_countcap").value = fit;
  applyPanel();          // appearance only, so this repaints rather than refetching
  return true;
}

// Debounced on tile loads
var fitPending = false, fitTimer = null;
function noteTileLoad() {
  syncFitButton();
  if (!fitPending) return;
  clearTimeout(fitTimer);
  fitTimer = setTimeout(function () {
    if (fitPending && applyFit()) fitPending = false;
  }, 400);
}
document.getElementById("in_countcap").addEventListener("input", function () {
  fitPending = false;               // a typed cap takes over from a pending fit
});
// Amber when fit has drifted too far
var FIT_DRIFT = 3;
var FIT_TITLE = document.getElementById("fitcap").title;
function syncFitButton() {
  var btn = document.getElementById("fitcap"), fit = fittedCap();
  var off = fit != null && (fit / CFG.countCap >= FIT_DRIFT || CFG.countCap / fit >= FIT_DRIFT);
  btn.classList.toggle("warn", off);
  btn.title = off ? "Recommended: re-fit to the cells in view." : FIT_TITLE;
}

var FIT_LABEL = "↕ fit", fitFlash = null;
document.getElementById("fitcap").addEventListener("click", function () {
  var btn = this;
  fitPending = false;
  btn.textContent = applyFit() ? "fitted" : "no cells";
  clearTimeout(fitFlash);
  fitFlash = setTimeout(function () { btn.textContent = FIT_LABEL; }, 1200);
});

var FIT_MAX_ZOOM = 10;
function taxonBounds(taxonId, expected) {
  var p = baseFilters();
  p.set("taxon_id", taxonId);
  p.set("per_page", "0");
  p.set("return_bounds", "true");
  p.set("fields", "id");
  if (expected) p.set("expected_nearby", "true");
  return retryJson("https://api.inaturalist.org/v2/observations?" + p.toString())
    .then(function (j) { return (j && j.total_bounds) || null; });
}
// zoom/pan to taxon's obs; uses geomodel when one exists, to remove outliers
function fitTaxonBounds(taxonId, doFit) {
  taxonBounds(taxonId, true).then(function (b) {
    return b || taxonBounds(taxonId, false);
  }).then(function (b) {
    if (!b || String(taxonId) !== CFG.taxonA) return;
    taxonExtent = b;
    if (doFit)
      map.fitBounds(L.latLngBounds([Math.max(-80, b.swlat), Math.max(-179.9, b.swlng)],
                                   [Math.min(80, b.nelat), Math.min(179.9, b.nelng)]),
                    { maxZoom: FIT_MAX_ZOOM, paddingTopLeft: [panelPad(), 10],
                      paddingBottomRight: [10, 10] });
    syncFitViewButton();
  });
}
var taxonExtent = null;
function syncFitViewButton() {
  var off = !!taxonExtent && !map.getBounds().intersects(
    L.latLngBounds([taxonExtent.swlat, taxonExtent.swlng],
                   [taxonExtent.nelat, taxonExtent.nelng]));
  document.getElementById("fitview").classList.toggle("warn", off);
}
document.getElementById("fitview").addEventListener("click", function () {
  fitTaxonBounds(CFG.taxonA, true);
});
var autoFitBtn = document.getElementById("autofit");
function syncAutoFit() {
  autoFitBtn.classList.toggle("on", CFG.fitView);
  autoFitBtn.setAttribute("aria-pressed", CFG.fitView ? "true" : "false");
}
autoFitBtn.addEventListener("click", function () {
  CFG.fitView = !CFG.fitView;
  syncAutoFit();
  syncUrl();
});

// A new taxon means a new confusion set, so the seed runs before anything is drawn
// and the previous pairing stays up until it lands.
function applyTaxon(taxonA) {
  if (String(taxonA) === CFG.taxonA) { applyPanel(); return; }
  closeAllPopups();
  clearBox();
  CFG.taxonA = String(taxonA);
  // null, not [] — not yet seeded, and a seed that fails to land must not leave
  // the link claiming an empty set was chosen.
  CFG.setIds = null;
  elA.dataset.id = CFG.taxonA;
  fitPending = true;       // a new taxon refits the count scale either way
  taxonExtent = null;
  syncFitViewButton();
  fitTaxonBounds(CFG.taxonA, CFG.fitView);
  fetchMapLayers();
  reseed();
}

var SHARE_URL = "https://jwidness.github.io/iNat_local_outlier_map.html";
var shareLink = SHARE_URL;

function syncUrl() {
  var p = new URLSearchParams();
  p.set("taxon_id", CFG.taxonA);
  // Absent means "seed it", empty means "the set is empty"
  if (CFG.setIds) p.set("taxon_set", CFG.setIds.join(","));
  CONTROLS.forEach(function (ctl) {
    if (ctl.cfg && CFG[ctl.cfg] != null) p.set(ctl.param, ctl.check ? (CFG[ctl.cfg] ? 1 : 0) : CFG[ctl.cfg]);
  });
  Object.keys(FILTERS).forEach(function (k) { p.set(k, FILTERS[k]); });
  Object.keys(BASEMAP_KEYS).forEach(function (k) {
    if (map.hasLayer(BASEMAPS[BASEMAP_KEYS[k]])) p.set("basemap", k);
  });
  var c = map.getCenter();
  // Wrapped, or panning onto another copy of the world writes a longitude the
  // link's own range check rejects on load.
  p.set("lat", c.lat.toFixed(4)); p.set("lng", wrapLng(c.lng).toFixed(4));
  p.set("zoom", map.getZoom());
  // Unescaped, so commas and colons read like iNat's own URLs.
  var q = p.toString().replace(/%2C/g, ",").replace(/%3A/g, ":");
  try { history.replaceState(null, "", location.pathname + "?" + q); } catch (e) {}
  shareLink = SHARE_URL + "?" + q;
}

var COPY_LABEL = "⧉ share link", copyTimer = null;
document.getElementById("copyShare").addEventListener("click", function () {
  var btn = this;
  function flash() {
    btn.textContent = "✓ copied";
    btn.classList.add("copied");
    clearTimeout(copyTimer);
    copyTimer = setTimeout(function () {
      btn.textContent = COPY_LABEL;
      btn.classList.remove("copied");
    }, 1200);
  }
  navigator.clipboard.writeText(shareLink).then(flash);
});

document.getElementById("panelToggle").addEventListener("click", function () {
  hideCard();
  var collapsed = document.getElementById("panel").classList.toggle("collapsed");
  this.textContent = collapsed ? "v" : "^";
  this.title = collapsed ? "Expand panel" : "Collapse panel";
});

var helpModal = document.getElementById("helpModal"), helpIframe = document.getElementById("helpIframe");
function openHelp() {
  helpIframe.src = "iNat_local_outlier_map_help.html";
  helpModal.classList.add("open");
  helpModal.setAttribute("aria-hidden", "false");
}
function closeHelp() {
  helpModal.classList.remove("open");
  helpModal.setAttribute("aria-hidden", "true");
  helpIframe.src = "about:blank";
}
document.getElementById("helpOpen").addEventListener("click", function (e) {
  e.preventDefault();
  openHelp();
});
document.getElementById("helpModalClose").addEventListener("click", closeHelp);
document.getElementById("helpModalOverlay").addEventListener("click", closeHelp);
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape" && helpModal.classList.contains("open")) closeHelp();
});
window.addEventListener("message", function (e) {
  if (e.data === "closeHelpModal" && helpModal.classList.contains("open")) closeHelp();
});

map.on("moveend", function () { syncUrl(); syncFitButton(); syncFitViewButton(); });
map.on("zoomend", syncLockNote);     // the lock lapses below its own zoom

// ---- boot ----------------------------------------------------------------
// A link with no taxon_set has never been seeded, so the set is fetched before
// the first tiles go out
function boot() {
  fitPending = !qs.has("count_cap");      // a link carrying one has chosen its scale
  fetchMapLayers();
  // A view in the link wins; without one, fit the taxon exactly as a pick would.
  fitTaxonBounds(CFG.taxonA, !qs.has("lat") && !qs.has("lng") && !qs.has("zoom"));
  if (!CFG.setIds) { reseed(); return; }
  // The link carries its own set, so the map draws at once. The seed rows are still
  // fetched without changing it: they carry the chips' counts, and the threshold
  // dropdown re-slices them.
  applyPanel();
  // A taxon the link names but the seed missed is counted here, which needs its rank.
  ranked().then(function () {
    return Promise.all([refreshTaxa(), fetchSeed(CFG.taxonA)]);
  }).then(function () {
    // A failed seed leaves nothing to net those counts against.
    if (seedTaxon === CFG.taxonA) setIds().forEach(fillSeedCount);
    runDiag();
  });
}
renderRamp();
syncPaletteBtn();
renderChannelSeg();
renderCountAxisSeg();
renderSeedSrcSeg();
renderGrades();
syncSignBox();
syncAutoFit();
syncSeedSrc();
syncLockNote();
boot();
</script>
